document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
      // Deep links: honor #section on load (e.g. #live-translator). The bundle
      // swaps the document after load, so the browser's native anchor jump
      // fires too early; wait until the section exists and its position is stable.
      if (location.hash.length > 1) {
        const id = decodeURIComponent(location.hash.slice(1));
        let tries = 0, lastTop = -1, done = false;
        const jump = () => {
          if (done) return;
          const el = document.getElementById(id);
          if (el) {
            const top = Math.round(el.getBoundingClientRect().top + window.scrollY);
            if (top === lastTop && top > 0) {
              window.scrollTo({ top: top, behavior: 'instant' });
              if (window.__flushScroll) window.__flushScroll();
              done = true;
              return;
            }
            lastTop = top;
          }
          if (++tries < 60) setTimeout(jump, 150);
        };
        setTimeout(jump, 200);
      }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 untraced. Exact values are therefore NOT shown. Restore them only once the cell is verified. -->\n<section data-screen-label=\"Chapter 1 — Evidence · socioeconomic\" style=\"background:#FFFFFF;color:#0B0B0C;padding:clamp(120px,22vh,260px) clamp(20px,6vw,88px) clamp(80px,14vh,160px)\">\n  <div style=\"max-width:720px\">\n    <div style=\"font-size:clamp(30px,3.6vw,56px);font-weight:600;letter-spacing:-.04em;line-height:1.02;text-wrap:balance;max-width:22ch\">Lower-GDP states were associated with longer outages, even after controlling for event cause.<\u002Fdiv>\n    <div style=\"margin-top:18px;font-size:clamp(16px,1.3vw,18px);color:#6E6E73;line-height:1.45;max-width:40ch\">Rural share was not significant in the controlled model.<\u002Fdiv>\n    <div style=\"margin-top:10px;font-size:clamp(16px,1.3vw,18px);color:#6E6E73;line-height:1.45;max-width:40ch\">Association, not causation.<\u002Fdiv>\n    <div style=\"margin-top:clamp(36px,5vh,56px);max-width:560px\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:24px;padding:14px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);color:#0B0B0C\">Controlled for<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73\">event cause<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:24px;padding:14px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);color:#0B0B0C\">Model<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73\">OLS on log outage duration<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:24px;padding:14px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);color:#0B0B0C\">GDP<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73\"><span style=\"font-family:'IBM Plex Mono',ui-monospace,Menlo,monos x);font-weight:600;letter-spacing:-.045em;line-height:.96;will-change:transform,opacity,filter;white-space:normal;width:min(92vw,14ch);font-size:clamp(36px,5.4vw,92px)\">A bet on proactive AI.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<section data-screen-label=\"Release → Chapter 3\" style=\"background:#FFFFFF;padding:clamp(100px,18vh,220px) clamp(20px,6vw,88px) clamp(140px,24vh,300px)\">\n  <div style=\"font-size:clamp(20px,2.2vw,34px);color:#6E6E73;letter-spacing:-.02em;line-height:1.3;max-width:26ch;margin-bottom:clamp(120px,22vh,260px)\">I wanted an assistant<br>that didn’t wait to be asked.<\u002Fdiv>\n  <div style=\"margin-top:28px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:#6E6E73;line-height:1.7\">nightly recap · 21:58 · Telegram<br><span style=\"white-space:nowrap\">healthcheck.sh<\u002Fspan> · every 5 minutes · observed recovery ~10 s<br>$12/mo · 1 vCPU · 2 GB<br>known limit · OAuth expiry → manual /login<\u002Fdiv>\n  <div style=\"margin-top:16px;font-size:13px;color:#6E6E73;line-height:1.5\">Doudou · <a href=\"https://github.com/EM917/doudou\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#0B0B0C;text-decoration:underline;text-underline-offset:3px\">Repository ↗<\u002Fa><\u002Fdiv>\n<\u002Fsection>\n<section id=\"live-translator\" data-screen-label=\"Chapter 3 entry\" style=\"background:#FFFFFF;padding:clamp(100px,18vh,220px) clamp(20px,6vw,88px) clamp(140px,24vh,300px)\">\n  <div style=\"font-size:15px;color:#6E6E73;margin-bottom:18px\">Chapter three<\u002Fdiv>\n  <div style=\"font-size:clamp(34px,5vw,84px);font-weight:600;letter-spacing:-.04em;line-height:1\">Live Translator<\u002Fdiv>\n  <div style=\"margin-top:clamp(60px,10vh,120px);font-size:clamp(18px,1.8vw,26px);color:#6E6E73;letter-spacing:-.02em\">Live audio keeps moving.<\u002Fdiv>\n<\u002Fsection>\n<!-- ══════════ CHAPTER 3 · LIVE TRANSLATOR · an open soundstage → the camera listens closer → a recognition plane turns sound into language → checked first → translated later → the language changes, the pipeline doesn't → judgment ══════════\n     The film shows only product behaviour; the engineering (bounded translation queue, drop-oldest, source recovery, latency telemetry) is read afterwards in the evidence rows.\n     Facts from EM917/tiktok-live-translator @ main: pipeline.py, detector.py (checks on recognized SOURCE text), resolver.py (re-resolve + reconnect; current adapter TikTok Live), audit.py, README (Whisper auto source detection, 90+ languages, configurable target).\n     Demonstration caption is illustrative (“We’ll be back in a few minutes.”); the source language is whatever arrives, the target is a setting. -->\n<div ref=\"{{ x.stage }}\" data-screen-label=\"Chapter 3 — Live Translator stage\" style=\"height:560vh;position:relative;background:#FFFFFF\">\n  <div ref=\"{{ x.pane }}\" style=\"position:sticky;top:0;height:100vh;overflow:hidden;background:#FFFFFF;color:#0B0B0C\">\n    \n    <!-- the soundstage · four open arcs, hairline, extending past both edges; the centre stays calm and holds the content -->\n    <canvas ref=\"{{ x.canvas }}\" style=\"position:absolute;inset:0;width:100%;height:100%;z-index:10\"><\u002Fcanvas>\n\n    <div ref=\"{{ x.src }}\" style=\"position:absolute;left:50%;z-index:22;opacity:0;text-align:center;font-size:clamp(20px,2.2vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.25;color:#0B0B0C;width:min(88vw,30ch);will-change:transform,opacity\">We’ll be back in a few minutes.<\u002Fdiv>\n    <div ref=\"{{ x.tr0 }}\" style=\"position:absolute;left:50%;z-index:22;opacity:0;text-align:center;font-size:clamp(20px,2.2vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.25;color:#0B0B0C;width:min(88vw,30ch);will-change:transform,opacity;color:#6E6E73;font-weight:400\">数分後に戻ります。<\u002Fdiv>\n    <div ref=\"{{ x.tr1 }}\" style=\"position:absolute;left:50%;z-index:22;opacity:0;text-align:center;font-size:clamp(20px,2.2vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.25;color:#0B0B0C;width:min(88vw,30ch);will-change:transform,opacity;color:#6E6E73;font-weight:400\">몇 분 후에 다시 돌아오겠습니다.<\u002Fdiv>\n    <div ref=\"{{ x.tr2 }}\" style=\"position:absolute;left:50%;z-index:22;opacity:0;text-align:center;font-size:clamp(20px,2.2vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.25;color:#0B0B0C;width:min(88vw,30ch);will-change:transform,opacity;color:#6E6E73;font-weight:400\">我们几分钟后回来。<\u002Fdiv>\n    <div ref=\"{{ x.tr3 }}\" style=\"position:absolute;left:50%;z-index:22;opacity:0;text-align:center;font-size:clamp(20px,2.2vw,34px);font-weight:500;letter-spacing:-.02em;line-height:1.25;color:#0B0B0C;width:min(88vw,30ch);will-change:transform,opacity;color:#6E6E73;font-weight:400\">Volvemos en unos minutos.<\u002Fdiv>\n\n    <div ref=\"{{ x.c0 }}\" style=\"position:absolute;left:50%;z-index:30;opacity:0;text-align:center;font-size:clamp(30px,4.6vw,72px);font-weight:600;letter-spacing:-.04em;line-height:1.02;color:#0B0B0C;width:min(90vw,18ch);text-wrap:balance;will-change:transform,opacity,filter\">A voice comes in.<\u002Fdiv>\n    <div ref=\"{{ x.c1 }}\" style=\"position:absolute;left:50%;z-index:30;opacity:0;text-align:center;font-size:clamp(30px,4.6vw,72px);font-weight:600;letter-spacing:-.04em;line-height:1.02;color:#0B0B0C;width:min(90vw,18ch);text-wrap:balance;will-change:transform,opacity,filter\">A banned term can’t wait for translation.<\u002Fdiv>\n    <div ref=\"{{ x.c2 }}\" style=\"position:absolute;left:50%;z-index:30;opacity:0;text-align:center;font-size:clamp(30px,4.6vw,72px);font-weight:600;letter-spacing:-.04em;line-height:1.02;color:#0B0B0C;width:min(90vw,18ch);text-wrap:balance;will-change:transform,opacity,filter;font-size:clamp(20px,2.4vw,38px);letter-spacing:-.03em;line-height:1.1;width:min(90vw,24ch);color:#6E6E73\">The language changed.<br>The pipeline didn’t.<\u002Fdiv>\n    <div ref=\"{{ x.fin }}\" style=\"position:absolute;left:50%;z-index:30;opacity:0;text-align:center;font-size:clamp(30px,4.6vw,72px);font-weight:600;letter-spacing:-.04em;line-height:1.02;color:#0B0B0C;width:min(90vw,18ch);text-wrap:balance;will-change:transform,opacity,filter;font-size:clamp(34px,5vw,84px);letter-spacing:-.045em;line-height:1;width:min(92vw,16ch)\">Real time is knowing what can’t wait.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Chapter 3 · after the film releases: the engineering, read rather than watched. Four rows, no cards. -->\n<section data-screen-label=\"Chapter 3 — Engineering evidence\" style=\"background:#FFFFFF;color:#0B0B0C;padding:clamp(120px,22vh,260px) clamp(20px,6vw,88px) clamp(80px,14vh,160px)\">\n  <div style=\"max-width:720px\">\n    <div style=\"font-size:clamp(30px,3.6vw,56px);font-weight:600;letter-spacing:-.04em;line-height:1.02;text-wrap:balance;max-width:22ch\">The live path doesn’t wait for translation.<\u002Fdiv>\n    <div style=\"margin-top:clamp(36px,5vh,56px);max-width:620px\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:baseline;gap:24px;padding:16px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);font-weight:500\">Critical path<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73;line-height:1.45\">Banned-term checks run on recognized source text, never on translation. Source captions can also ship before translation returns.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:baseline;gap:24px;padding:16px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);font-weight:500\">Backpressure<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73;line-height:1.45\">Translation runs on a bounded queue. When it falls behind, stale work is dropped instead of blocking recognition.<div style=\"font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:#6E6E73;margin-top:6px\">maxsize=4 · drop oldest<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:baseline;gap:24px;padding:16px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);font-weight:500\">Recovery<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73;line-height:1.45\">When the live source drops, the system resolves a fresh source and reconnects.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:baseline;gap:24px;padding:16px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);font-weight:500\">Observability<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73;line-height:1.45\">Latency is measured rather than guessed.<div style=\"font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:#6E6E73;margin-top:6px\">time-to-first-caption · P50 / P95 · segmentation · recognition · translation<br>Hy-MT2 7B translation · 892 ms median · 1.7 s p95<br>Whisper large-v3 · MLX · RTF 0.21 · M3 Pro, 90 s recorded audio<\u002Fdiv><div style=\"font-size:13px;color:#6E6E73;margin-top:6px\">Stage-specific benchmarks from the repository, not end-to-end guarantees.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);align-items:baseline;gap:24px;padding:16px 0;border-top:1px solid #D2D2D7\"><div style=\"font-size:clamp(15px,1.2vw,18px);font-weight:500\">Evaluation<\u002Fdiv><div style=\"font-size:clamp(15px,1.2vw,18px);color:#6E6E73;line-height:1.45\">In a 259-caption blind review across four engines, the paid engine did not measurably outperform the local alternatives on this material.<div style=\"font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:#6E6E73;margin-top:6px\">259 captions · 4 engines · blind review<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"border-top:1px solid #D2D2D7\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px;font-size:13px;color:#6E6E73;line-height:1.5;max-width:60ch\">Source language is auto-detected across 90+ recognition languages. Target language is configurable.<div style=\"margin-top:8px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:#6E6E73\">Whisper large-v3 · faster-whisper / MLX · Hy-MT2 / Ollama · asyncio<\u002Fdiv><div style=\"margin-top:6px;font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:13px;color:#6E6E73\">Current live-source adapter · TikTok Live<\u002Fdiv><a style=\"display:inline-block;margin-top:8px\" href=\"https://github.com/EM917/tiktok-live-translator\" target=\"_blank\" rel=\"noopener noreferrer\">Repository<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<section id=\"about\" data-screen-label=\"About\" style=\"background:#FFFFFF;color:#0B0B0C;padding:clamp(140px,24vh,300px) clamp(20px,6vw,88px) clamp(80px,14vh,160px)\">\n  <div style=\"max-width:720px\">\n    <div style=\"font-size:15px;color:#6E6E73;margin-bottom:18px\">About<\u002Fdiv>\n    <div style=\"font-size:clamp(34px,5vw,84px);font-weight:600;letter-spacing:-.04em;line-height:1\">Yilong Mei<\u002Fdiv>\n    <div style=\"margin-top:clamp(24px,3vh,36px);font-size:clamp(18px,1.6vw,24px);line-height:1.5;color:#0B0B0C;max-width:34ch\">AI Product Engineer.<br>B.S. Cognitive Science, Machine Learning and Neural Computation · UC San Diego<br>Based in Los Angeles.<br>Available now · Seeking new-grad roles in applied AI and software engineering.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"background:#FFFFFF;color:#0B0B0C;padding:clamp(80px,14vh,160px) clamp(20px,6vw,88px) clamp(60px,10vh,120px)\">\n  <div style=\"max-width:720px\">\n    <div style=\"font-size:15px;color:#6E6E73;margin-bottom:18px\">Contact<\u002Fdiv>\n    <div style=\"font-size:clamp(34px,5vw,84px);font-weight:600;letter-spacing:-.04em;line-heig s of segs) { s.style.maskImage = s.style.webkitMaskImage = 'none'; s.style.background = '#0B0B0C'; } D.line.current.style.maskImage = D.line.current.style.webkitMaskImage = 'none'; }\n    }\n    // ── BOUNDARY · the converged spine gives the line back: a horizontal boundary beneath one file, then a dash, then nothing\n    const conv = W(T.boundary.converge), bl = W(T.boundary.line), dash = W(T.boundary.lineToDash), dg = W(T.boundary.dashGone);\n    if (bl > 0) { lx = 0; ly = lerp(G.nodeY[1] - vh / 2, G.cmY + 22 - vh / 2, bl); lw = lerp(lerp(0, G.boundW, bl), 24, dash); lrot = 0; lo = bl * (1 - dg); }\n    // the line is ink beneath the input, a quiet separator while the report is read, and ink again once it becomes system structure\n    const inReport = lt >= 1 && rc <= 0 && bl <= 0, toStruct = rc > 0 && bl <= 0;\n    D.line.current.style.background = (this._qGap || 0) > .3 ? '#B4B4B9' : inReport ? mixInk(0) : toStruct ? mixInk(rc) : lt > 0 && lt < 1 ? mixInk(1 - lt) : '#0B0B0C';\n    line(lx, ly, lw, lrot, lo);\n    // ── QUESTION · owns the frame with only the bare axis behind it\n    const [q1In, q1Out] = EO([...T.question.enter, ...T.question.out]);\n    put(D.q1.current, 0, ((1 - q1In) * 20 - q1Out * vh * .06) * mv, lerp(1, .97, q1Out), q1In * (1 - q1Out), q1Out * 4);\n    // ── RUNTIME · three layers resolve out of the spine; the implementation beneath each, small\n    const fail = W(T.failure.collapse), rebuilt = W(T.recovery.rebuild), broken = fail * (1 - rebuilt);\n    const pulse = Math.sin(Math.PI * W(T.preventive.pulse));\n    for (let i = 0; i < 2; i++) { const s = D['s' + i].current, brk = 1 - .5 * broken; s.style.transform = `scaleY(${hand * brk * (1 - conv)})`; s.style.opacity = hand * (1 - .6 * pulse) * (1 - W(T.boundary.line)); }\n    for (let i = 0; i < 3; i++) {\n      const n = D['n' + i].current, e = S(T.runtime.nodes[0] + i * .012, T.runtime.nodes[1] + i * .012);\n      let dy = 0, op = e, sc = lerp(.6, 1, e), sy = lerp(.2, 1, e);\n      if (i === 1) { sc *= 1 - broken; sy *= 1 - broken; op *= cl(1 - (broken - .8) / .2); }   // the AI process contracts into its point on the spine, then the point is gone\n      if (i === 2) dy += broken * 10;\n      dy += (G.nodeY[1] - G.nodeY[i]) * conv; op *= (1 - conv) * (1 - .6 * pulse);\n      n.style.transform = `translate(-50%, calc(-50% + ${dy}px)) scale(${sc}, ${sy})`; n.style.opacity = op;\n    }\n    // ── FAILURE → RECOVERY · the check emerges from the top of the spine, travels the spine to the gap, holds; repair starts there\n    const pe = W(T.recovery.probeEmerge), pr = W(T.recovery.probeTravel), pg = W(T.recovery.probeGone);\n    const gapTop = G.nodeY[0] + G.spineH / 4;\n    D.probe.current.style.transform = `translate(-50%, calc(-50% + ${lerp(G.nodeY[0], gapTop, pr) - G.nodeY[1]}px)) scale(${pe})`; D.probe.current.style.opacity = pe * (1 - pg);\n    const hcIn = W(T.recovery.proofHc), rsIn = W(T.recovery.proofRs), pOut = W(T.recovery.proofOut);\n    D.hc.current.style.transform = `translate(${(1 - hcIn) * 10}px, -50%)`; D.hc.current.style.opacity = hcIn * (1 - pOut);\n    // rs top sits 8px below hc's bottom (hc is centred on the anchor), whatever rs's own wrap\n    D.rs.current.style.transform = `translate(${(1 - rsIn) * 10}px, ${(D.hc.current.offsetHeight || 17) / 2 + 8}px)`; D.rs.current.style.opacity = rsIn * (1 - pOut);\n    // ── BOUNDARY copy and file\n    const [q2In, q2Out] = EO(T.boundary.question);\n    put(D.q2.current, 0, ((1 - q2In) * 20 - q2Out * vh * .06) * mv, lerp(1, .97, q2Out), q2In * (1 - q2Out), q2Out * 4);\n    const cmIn = W(T.boundary.file), cmOut = W(T.boundary.fileOut);\n    put(D.cm.current, 0, (1 - cmIn) * 10 * mv, lerp(1, .9, cmOut), cmIn * (1 - cmOut), 0);\n    { const [e, o] = EO(T.boundary.proof); put(D.cmSub.current, 0, 4 + (1 - e) * 6, 1, e * (1 - o), 0); }\n    { const [e, o] = EO(T.boundary.evolve); put(D.ev.current, 0, 6 + (1 - e) * 6, 1, e * (1 - o), 0); }\n    // ── upper copy · one line at a time, above the chain\n    const cw = { c4: T.failure.copy, c9: T.recovery.noticed, c5: T.recovery.copy, c6: T.preventive.copy, c7: T.boundary.read, c8: T.boundary.write };\n    for (const k in cw) { const [e, o] = EO(cw[k]); put(D[k].current, 0, ((1 - e) * 12 - o * 8) * mv, 1, e * (1 - o), 0); }\n    // ── REFLECTION · the dash leaves silence; one thought, held to the unpin\n    const fIn = W(T.reflection.enter);\n    put(D.fin.current, 0, (1 - fIn) * 20 * mv, 1, fIn, 0);\n  }\n\n  // ── Chapter 3 · Live Translator ─────────────────────────────────────────────────────────────────────────────\n  // Material: an open soundstage. Four hairline arcs of very large radius pass through the viewport and beyond both edges; they never\n  // meet, never close, and leave the centre calm for the content. The camera (translate + scale + a widening of the stage) selects one\n  // listening moment; a recognition plane moving left → right turns sound into language; from then on only typography remains.\n  // Each arc: endpoints and two control points in stage units (x · vw, y · vh, y measured from the centre line), plus its weight.\n  // Control points are chosen so the curves themselves keep the centre calm (closest approach ≈ .19vh above / .21vh below the centre line);\n  // no clamping is applied to the geometry.\n  static ARCS = [\n    { p: [[-.18, -.46], [.24, -.19], [.66, -.17], [1.18, -.42]], w: .62 },   // upper primary · dips toward the centre, asymmetric\n    { p: [[-.18, -.30], [.18, -.38], [.78, -.26], [1.18, -.52]], w: .16 },   // upper secondary\n    { p: [[-.18, .40], [.34, .18], [.76, .23], [1.18, .46]], w: .58 },       // lower primary · longer approach, later peak\n    { p: [[-.18, .24], [.30, .40], [.82, .28], [1.18, .34]], w: .14 }        // lower secondary\n  ];\n  measureTranslator() {\n    const X = this.x, st = X.stage.current; if (!st || !this.win) return false;\n    for (const k in X) if (!X[k].current) return false;\n    const vw = this.vw, vh = this.vh, m = this.mobile; if (!(vw > 0 && vh > 0)) return false;\n    st.style.height = (this.reduce ? 320 : m ? 480 : 560) + 'vh';\n    this.topX = st.getBoundingClientRect().top + this.scrollY();\n    this.lenX = st.offsetHeight - vh;\n    const dpr = Math.min(2, this.win.devicePixelRatio || 1), cv = X.canvas.current;\n    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr); this.xdpr = dpr;\n    const F = this.layoutRules(vw, vh).field;\n    const cy = F.y + F.h * .5, cx = vw / 2;\n    for (const k of ['c0','c1','fin']) { X[k].current.style.top = cy + 'px'; X[k].current.style.transform = 'none'; }\n    const src = X.src.current; src.style.transform = 'none'; src.style.clipPath = 'none'; const srcH = src.offsetHeight;\n    const tr = X.tr2.current; tr.style.transform = 'none'; const trH = tr.offsetHeight;\n    const upShift = Math.min(40, Math.max(30, srcH / 2 + 8));\n    src.style.top = cy + 'px'; src.style.left = cx + 'px';\n    const trY = cy - upShift + srcH / 2 + 12 + trH / 2;\n    for (const k of ['tr0','tr1','tr2','tr3']) { X[k].current.style.top = trY + 'px'; X[k].current.style.left = cx + 'px'; }\n    // the smaller multilingual statement sits above the caption pair with ≥ 64px clearance\n    const c2 = X.c2.current; c2.style.transform = 'none'; const c2H = c2.offsetHeight;\n    const pairTop = cy - upShift - srcH / 2;\n    c2.style.top = Math.min(F.y + F.h * .24, pairTop - 64 - c2H / 2) + 'px';\n    // the arcs are designed to clear the centre content by geometry; assert it (dev only) rather than clamp it\n    const c0H = X.c0.current.offsetHeight, need = c0H / 2 + 56;\n    if (vh * .17 < need) console.warn('[translator] soundstage clearance', Math.round(vh * .17), '< headline need', Math.round(need));\n    this.xGeom = { F, cy, cx, srcH, trH, upShift, srcW: src.getBoundingClientRect().width, m };\n  }\n  // Chapter 3 canonical timeline · one raw 0→1 coordinate. Six acts; the gaps between windows are the holds.\n  static TTL = {\n    soundstage:  { arcsIn: [.00, .06], c0In: [.05, .07], c0Out: [.12, .135] },   // arcs present from the first frame (no empty entry)\n    focus:       { camera: [.14, .20] },                                    // hold .20–.22, no copy\n    recognition: { plane: [.22, .30] },                                     // hold .30–.35, caption alone\n    check:       { scan: [.35, .38], clear: [.385, .40] },                  // hold .40–.44, caption alone\n    translation: { shift: [.44, .46], reveal: [.465, .49], pairOut: [.56, .575] },   // hold .49–.56 on the pair\n    meaning:     { c1In: [.562, .58], c1Out: [.65, .66] },                  // meaning enters as the pair leaves: no empty frame\n    languages:   { pairIn: [.65, .67], cycle: [.69, .79], c2In: [.79, .805], c2Out: [.85, .86], pairOut: [.85, .868] },   // pair enters as c1 leaves\n    thesis:      { finIn: [.86, .878] }                                     // begins under the leaving pair · resolved at .878 · holds to 1.0\n  };\n  updateTranslator() {\n    const X = this.x, G = this.xGeom, T = Component.TTL; if (!this.lenX || !this.win || !G) return;\n    for (const k in X) if (!X[k].current) return;\n    const cl = v => Math.min(1, Math.max(0, v));\n    this.topX = X.stage.current.getBoundingClientRect().top + this.scrollY();\n    const t = cl((this.scrollY() - this.topX) / this.lenX);\n    const S = (a, b) => { const x = cl((t - a) / (b - a)); return x * x * (3 - 2 * x); };\n    const W = w => S(w[0], w[1]);\n    const lerp = (a, b, k) => a + (b - a) * k;\n    const blurOn = !this.reduce && (this.props.depthBlur ?? true), mv = this.reduce ? .3 : 1;\n    const vw = this.vw, vh = this.vh, { cy, cx, srcH, upShift, srcW } = G;\n    const put = (el, x, y, s, o, b, clip) => { el.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${s})`; el.style.opacity = cl(o); el.style.filter = blurOn && b > .05 ? `blur(${b}px)` : 'none'; if (clip !== undefined) el.style.clipPath = clip; };\n\n    const arcsIn = .35 + .65 * W(T.soundstage.arcsIn);   // the soundstage is present from t = 0 (no white frame at the pin), then completes\n    const c0 = W(T.soundstage.c0In) * (1 - W(T.soundstage.c0Out));\n    const cam = W(T.focus.camera);\n    const plane = W(T.recognition.plane);\n    const scan = W(T.check.scan), scanClear = W(T.check.clear);\n    const shift = W(T.translation.shift), reveal = W(T.translation.reveal), pairOut1 = W(T.translation.pairOut);\n    const c1 = W(T.meaning.c1In) * (1 - W(T.meaning.c1Out));\n    const pairIn2 = W(T.languages.pairIn), cyc = W(T.languages.cycle), c2 = W(T.languages.c2In) * (1 - W(T.languages.c2Out)), pairOut2 = W(T.languages.pairOut);\n    const fin = W(T.thesis.finIn);\n\n    // statements · each in the calm centre, never at the same time as the captions\n    put(X.c0.current, 0, 0, lerp(1.04, 1, W(T.soundstage.c0In)), c0, (1 - W(T.soundstage.c0In)) * 2);\n    put(X.c1.current, 0, 0, lerp(.97, 1, W(T.meaning.c1In)), c1, 0);\n    put(X.c2.current, 0, (1 - W(T.languages.c2In)) * 14 * mv, 1, c2, 0);\n    put(X.fin.current, 0, 0, lerp(1.03, 1, fin), fin, 0);\n\n    // captions · the source is revealed by the recognition plane at its final position; the same element lifts before the translation appears\n    const capL = cx - srcW / 2, planeX = lerp(-vw * .05, vw * 1.05, plane);\n    const revealFrac = plane >= 1 ? 1 : cl((planeX - capL) / srcW);\n    const pairVis1 = (plane > 0 ? 1 : 0) * (1 - pairOut1);\n    const srcVis = cl(pairVis1 + pairIn2 * (1 - pairOut2));\n    const lifted = cl(shift + pairIn2);\n    put(X.src.current, 0, -upShift * lifted, 1, srcVis, 0, revealFrac >= 1 ? 'none' : `inset(-2px ${(1 - revealFrac) * 100}% -2px -2px)`);\n    // act 5: the Chinese translation is revealed beneath; act 7: one stable position cycles 日本語 → 한국어 → 中文 → Español\n    const trReveal1 = cl(reveal * (1 - pairOut1));\n    for (let i = 0; i < 4; i++) {\n      const el = X['tr' + i].current;\n      let a1 = i === 2 ? trReveal1 : 0;   // act 5 shows the Chinese target\n      // act 7  is drawn as a second, clipped pass that is\n      //   displaced outward and faded — the curve stays continuous, only its state changes across the boundary.\n      const P = (arc, outward) => { const [a, b, c, d] = arc.p, sign = b[1] < 0 ? -1 : 1; const X_ = nx => cx + (nx * vw - cx) * zoomX + drift, Y_ = ny => cy + ny * vh * spread * breath + sign * enter + sign * outward; const p = new Path2D(); p.moveTo(X_(a[0]), Y_(a[1])); p.bezierCurveTo(X_(b[0]), Y_(b[1]), X_(c[0]), Y_(c[1]), X_(d[0]), Y_(d[1])); return p; };\n      const soft = 90;   // width of the transition band at the plane\n      for (const arc of Component.ARCS) {\n        g.lineWidth = arc.w > .4 ? 1.2 : 1;\n        // right of the plane (still sound): full state, clipped to x ≥ planeX − soft\n        g.save(); g.beginPath(); g.rect(plane > 0 ? planeX - soft : -50, -50, vw + 100, vh + 100); g.clip();\n        g.strokeStyle = ink(arc.w * stageVis); g.stroke(P(arc, 0)); g.restore();\n        if (plane > 0) {\n          // the band: the same curve drawn once more, receding, with alpha falling across the band via a horizontal gradient stroke\n          const grad = g.createLinearGradient(planeX - soft, 0, planeX, 0); grad.addColorStop(0, ink(0)); grad.addColorStop(1, ink(arc.w * stageVis * .5));\n          g.save(); g.beginPath(); g.rect(planeX - soft, -50, soft, vh + 100); g.clip();\n          g.strokeStyle = grad; g.stroke(P(arc, vh * .06)); g.restore();\n          // understood (left of the band): the curve has receded further and is nearly gone\n          g.save(); g.beginPath(); g.rect(-50, -50, planeX - soft + 50, vh + 100); g.clip();\n          g.strokeStyle = ink(arc.w * stageVis * .10); g.stroke(P(arc, vh * .12)); g.restore();\n        }\n      }\n      // the recognition marker · a small moving tick at the reveal edge, not a scanner\n      if (plane > 0 && plane < 1) { g.strokeStyle = ink(.5); g.lineWidth = 1; g.beginPath(); g.moveTo(planeX, cy - 12); g.lineTo(planeX, cy + 12); g.stroke(); }\n    }\n    // the check · one restrained blue action beneath the existing caption, then gone\n    if (scan > 0 && scanClear < 1) {\n      const L = cx - srcW / 2, R = cx + srcW / 2, w = Math.min(120, srcW * .28), y = cy + srcH / 2 + 8, e = lerp(L, R, scan);\n      g.strokeStyle = `rgba(10,91,214,${.9 * (1 - scanClear)})`; g.lineWidth = 2; g.beginPath(); g.moveTo(Math.max(L, e - w), y); g.lineTo(e, y); g.stroke();\n    }\n  }\n  renderVals() { return { r: this.r, w: this.w, o: this.o, d: this.d, x: this.x }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
